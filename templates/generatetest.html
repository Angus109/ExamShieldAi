{% extends 'professor_dashboard.html' %}
{% block body %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-lg-5">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="page-icon generate-test">
                            <i class="fas fa-magic"></i>
                        </div>
                        <h3 class="page-title">GENERATE QUESTIONS & ANSWERS</h3>
                        <p class="page-subtitle">AI-powered question generation from your content</p>
                    </div>

                    <!-- Animation -->
                    <div class="text-center mb-4">
                        <lottie-player 
                            src="https://assets3.lottiefiles.com/packages/lf20_6CrYF1.json"
                            background="transparent"
                            speed="1"
                            style="width: 400px; height: 300px;"
                            loop
                            autoplay>
                        </lottie-player>
                    </div>

                    <!-- Form Section -->
                    <div class="form-container">
                        <form method="POST" action="test_generate" class="generate-form">
                            <div class="form-group mb-4">
                                <label class="form-label" for="inputText">Input Text</label>
                                <textarea 
                                    name="itext" 
                                    id="inputText"
                                    class="form-control form-control-lg" 
                                    placeholder="Enter your content here to generate questions..."
                                    rows="6" 
                                    required>
                                </textarea>
                                <div class="form-text">
                                    <i class="fas fa-info-circle me-1"></i>
                                    Paste your study material, notes, or any text content
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group mb-4">
                                        <label class="form-label" for="questionType">Question Type</label>
                                        <div class="select-wrapper">
                                            <select class="form-select form-select-lg" id="questionType" name="test_type" required>
                                                <option value="objective">📝 Objective (MCQ)</option>
                                                <option value="subjective">✍️ Subjective (Descriptive)</option>
                                            </select>
                                            <div class="select-icon">
                                                <i class="fas fa-chevron-down"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group mb-4">
                                        <label class="form-label" for="numQuestions">Number of Questions</label>
                                        <input 
                                            type="number" 
                                            name="noq" 
                                            id="numQuestions"
                                            class="form-control form-control-lg" 
                                            placeholder="e.g., 10"
                                            min="1" 
                                            max="50"
                                            required>
                                        <div class="form-text">Maximum 50 questions</div>
                                    </div>
                                </div>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-lg px-5">
                                    <i class="fas fa-cogs me-2"></i>Generate Questions
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Generate Test Styles */
.page-icon.generate-test {
    background: linear-gradient(135deg, #667eea, #764ba2);
    width: 80px;
    height: 80px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    color: white;
    font-size: 2rem;
}

.page-title {
    color: #2c3e50;
    font-weight: 700;
    margin-bottom: 0.5rem;
}

.page-subtitle {
    color: #6c757d;
    font-size: 1.1rem;
    margin-bottom: 0;
}

.card {
    border-radius: 20px;
}

.form-container {
    background: #f8f9fa;
    padding: 2rem;
    border-radius: 15px;
    border: 1px solid #e9ecef;
}

.form-label {
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 0.75rem;
    display: block;
}

.form-control {
    border-radius: 12px;
    border: 2px solid #e9ecef;
    transition: all 0.3s ease;
}

.form-control:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
}

.form-control-lg {
    padding: 1rem;
}

.select-wrapper {
    position: relative;
}

.form-select {
    border-radius: 12px;
    border: 2px solid #e9ecef;
    padding: 1rem 3rem 1rem 1rem;
    background: white;
    transition: all 0.3s ease;
    appearance: none;
}

.form-select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
}

.select-icon {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: #6c757d;
    pointer-events: none;
}

.form-text {
    color: #6c757d;
    font-size: 0.875rem;
    margin-top: 0.5rem;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 25px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

/* Responsive Design */
@media (max-width: 768px) {
    .card-body {
        padding: 2rem 1rem;
    }
    
    .form-container {
        padding: 1.5rem;
    }
    
    .btn-lg {
        width: 100%;
        padding: 1rem;
    }
    
    .page-title {
        font-size: 1.5rem;
    }
}

@media (max-width: 576px) {
    .page-icon {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
    }
    
    lottie-player {
        width: 300px !important;
        height: 200px !important;
    }
}
</style>
{% endblock %}
