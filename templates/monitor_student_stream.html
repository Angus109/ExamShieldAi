{% extends 'professor_dashboard.html' %}
{% block body %}
<!DOCTYPE html>
<html>
<head>
  <title>Monitor Student Stream</title>
  <style>
:root {
    --student-primary: #17a2b8;
    --student-secondary: #007bff;
    --student-accent: #6f42c1;
    --student-gradient: linear-gradient(135deg, var(--student-primary) 0%, var(--student-secondary) 50%, var(--student-accent) 100%);
}
.enhanced-card {
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}
.enhanced-card-header {
    background: var(--student-gradient);
    padding: 1.5rem 2rem;
    border-radius: 20px 20px 0 0;
    color: white;
}
.video-embed-responsive {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    background: black;
}
video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100% !important;
    height: 100% !important;
    border: none;
    border-radius: 15px;
}
.status-connecting {
    color: #ffc107;
}
.status-connected {
    color: #28a745;
}
.status-error {
    color: #dc3545;
}
  </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card enhanced-card">
                <div class="enhanced-card-header text-center">
                    <h3>Monitoring Student: {{ student_uid }} (Exam ID: {{ testid }})</h3>
                </div>
                <div class="card-body p-4">
                    <div class="text-center">
                        <div class="video-embed-responsive">
                            <video id="remoteVideo" autoplay playsinline muted></video>
                        </div>
                        <p id="monitoringStatus" class="mt-3">Connecting to student stream...</p>
                        <button id="playButton" class="btn btn-primary mt-2" style="display: none;">Play Stream</button>
                        <button id="reconnectButton" class="btn btn-warning mt-2" style="display: none;">Reconnect</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.min.js"></script>
<script>
  const testId = "{{ testid }}";
  const studentUid = "{{ student_uid }}";
  const roomName = testId + '-' + studentUid;

  const socket = io(window.location.origin);
  const remoteVideo = document.getElementById('remoteVideo');
  const monitoringStatus = document.getElementById('monitoringStatus');
  const playButton = document.getElementById('playButton');
  const reconnectButton = document.getElementById('reconnectButton');

  const iceServers = {
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  };

  let peerConnection;
  const remoteStream = new MediaStream();
  let reconnectAttempts = 0;
  const MAX_RECONNECT_ATTEMPTS = 5;
  let isNegotiating = false;
  let makingOffer = false;

  function updateStatus(message, type = '') {
    monitoringStatus.textContent = message;
    monitoringStatus.className = 'mt-3'; // Reset classes
    if (type) monitoringStatus.classList.add(`status-${type}`);
  }

  async function startMonitoring() {
    try {
      updateStatus("Establishing connection...", "connecting");
      
      // Clean up any existing connection
      if (peerConnection) {
        peerConnection.close();
      }

      peerConnection = new RTCPeerConnection(iceServers);

      // Handle negotiation needed
      peerConnection.onnegotiationneeded = async () => {
        try {
          makingOffer = true;
          updateStatus("Preparing to receive stream...", "connecting");
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          socket.emit('offer', {
            room: roomName,
            offer: peerConnection.localDescription,
            sender_sid: socket.id
          });
        } catch (err) {
          console.error("Error in negotiation:", err);
          updateStatus("Error preparing connection", "error");
        } finally {
          makingOffer = false;
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice_candidate', { 
            room: roomName, 
            candidate: event.candidate,
            sender_sid: socket.id
          });
        }
      };

      peerConnection.ontrack = (event) => {
        console.log("Received remote track:", event.track);

        if (!remoteStream.getTracks().includes(event.track)) {
          remoteStream.addTrack(event.track);
        }

        if (remoteVideo.srcObject !== remoteStream) {
          remoteVideo.srcObject = remoteStream;
          console.log("Assigned remoteStream to video element.");
        }

        remoteVideo.onloadedmetadata = () => {
          remoteVideo.play().catch(e => {
            playButton.style.display = 'block';
            updateStatus("Click Play to start stream.", "connecting");
          });
        };
      };

      peerConnection.onconnectionstatechange = () => {
        console.log("Connection state:", peerConnection.connectionState);
        switch(peerConnection.connectionState) {
          case 'connected':
            updateStatus("Stream connected", "connected");
            reconnectAttempts = 0;
            break;
          case 'disconnected':
          case 'failed':
            handleDisconnection();
            break;
        }
      };

      // Join the room
      socket.emit('join', { room: roomName });

      // Handle incoming offers
      socket.on('offer', async (data) => {
        if (data.sender_sid !== socket.id && !isNegotiating) {
          try {
            isNegotiating = true;
            
            // Only if we're not already making an offer
            if (!makingOffer) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
              const answer = await peerConnection.createAnswer();
              await peerConnection.setLocalDescription(answer);
              socket.emit('answer', { 
                room: roomName, 
                answer: peerConnection.localDescription,
                sender_sid: socket.id
              });
              updateStatus("Receiving stream...", "connecting");
            }
          } catch (err) {
            console.error("Error handling offer:", err);
            updateStatus("Error establishing connection", "error");
          } finally {
            isNegotiating = false;
          }
        }
      });

      // Handle incoming answers
      socket.on('answer', async (data) => {
        if (data.sender_sid !== socket.id) {
          try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          } catch (err) {
            console.error("Error setting remote description:", err);
          }
        }
      });

      // Handle incoming ICE candidates
      socket.on('ice_candidate', async (data) => {
        if (data.sender_sid !== socket.id) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          } catch (err) {
            console.error("Error adding ICE candidate:", err);
          }
        }
      });

      // Handle student reconnection
      socket.on('student_reconnected', () => {
        updateStatus("Student reconnected. Re-establishing stream...", "connecting");
        startMonitoring();
      });

      // If student is already streaming, trigger negotiation
      socket.emit('request_offer', { room: roomName });

    } catch (err) {
      console.error("Monitoring error:", err);
      handleDisconnection();
    }
  }

  function handleDisconnection() {
    updateStatus("Stream disconnected. Attempting to reconnect...", "error");
    reconnectButton.style.display = 'block';
    
    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
      setTimeout(startMonitoring, 2000 * (reconnectAttempts + 1));
      reconnectAttempts++;
    }
  }

  // Socket.IO connection events
  socket.on('connect', () => {
    console.log("Connected to server");
    updateStatus("Connected to server. Waiting for student...", "connecting");
    startMonitoring();
  });

  socket.on('disconnect', () => {
    console.log("Disconnected from server");
    updateStatus("Disconnected from server. Reconnecting...", "error");
  });

  // UI event handlers
  playButton.addEventListener('click', () => {
    remoteVideo.play();
    playButton.style.display = 'none';
    updateStatus("Stream playing", "connected");
  });

  reconnectButton.addEventListener('click', () => {
    reconnectButton.style.display = 'none';
    reconnectAttempts = 0;
    startMonitoring();
  });

  window.addEventListener('beforeunload', () => {
    if (peerConnection) {
      peerConnection.close();
    }
    socket.disconnect();
  });

  // Initial connection
  startMonitoring();
</script>

</body>
</html>
{% endblock %}
