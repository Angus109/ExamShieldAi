{% extends 'professor_dashboard.html' %}
{% block body %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card enhanced-card">
                <div class="card-header enhanced-card-header text-center">
                    <h3 class="h3 card-title text-white mb-0">UPDATE PRACTICAL QUESTIONS</h3>
                </div>
                <div class="card-body p-4">
                    {% if (callresults != none and callresults) %}
                        {% for res in callresults%}    
                        <div class="question-item mb-4">
                            <div class="question-content">
                                <p class="question-text"><strong>Q {{res['qid']}}:</strong> {{res['q']}}</p>
                                <p class="question-marks"><strong>MARKS:</strong> {{res['marks']}}</p>
                            </div>
                            <div class="question-actions text-center mt-3">
                                <a href="/updatePQA/{{res['test_id']}}/{{res['qid']}}" class="btn btn-primary-student-theme btn-lg">
                                    <i class="fas fa-edit me-2"></i>UPDATE
                                </a>
                            </div>
                        </div>
                        {% endfor %}
                    {% else %}
                    <div class="empty-state text-center p-5">
                        <lottie-player 
                            src="https://assets7.lottiefiles.com/datafiles/vhvOcuUkH41HdrL/data.json"
                            background="transparent"
                            speed="1"
                            style="width: 300px; height: 300px;"
                            loop
                            autoplay>
                        </lottie-player>
                        <h3 class="empty-title">No Records Found!</h3>  
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Common styles for enhanced forms and tables */
:root {
    --student-primary: #17a2b8; /* Info/Cyan */
    --student-secondary: #007bff; /* Blue */
    --student-accent: #6f42c1; /* Purple */
    --student-gradient: linear-gradient(135deg, var(--student-primary) 0%, var(--student-secondary) 50%, var(--student-accent) 100%);
    --student-gradient-hover: linear-gradient(135deg, #148a9b 0%, #0069d9 50%, #5e37a8 100%);
    --student-dark: #2c3e50;
    --student-light: rgba(255, 255, 255, 0.1);
    --student-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    --student-shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
}

.enhanced-card {
    border: none;
    border-radius: 20px;
    box-shadow: var(--student-shadow);
    overflow: hidden;
    margin-bottom: 2rem;
}

.enhanced-card-header {
    background: var(--student-gradient);
    padding: 1.5rem 2rem;
    border-bottom: none;
    border-radius: 20px 20px 0 0;
}

.card-title {
    font-weight: 700;
}

.form-label {
    font-weight: 600;
    color: var(--student-dark);
    margin-bottom: 0.5rem;
}

.form-control-lg {
    border-radius: 12px;
    padding: 0.75rem 1rem;
    border: 2px solid #e9ecef;
    transition: all 0.3s ease;
}

.form-control-lg:focus {
    border-color: var(--student-primary);
    box-shadow: 0 0 0 0.2rem rgba(23, 162, 184, 0.25);
}

.input-group-merge .input-group-text {
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-right: none;
    border-radius: 12px 0 0 12px;
    color: #6c757d;
}

.input-group-merge .form-control {
    border-left: none;
    border-radius: 0 12px 12px 0;
}

textarea.form-control {
    resize: vertical; /* Allow vertical resizing */
    min-height: 80px; /* Minimum height for textareas */
}

.btn-primary-student-theme {
    background: linear-gradient(135deg, var(--student-primary), var(--student-secondary));
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.5rem;
    font-weight: 600;
    transition: all 0.3s ease;
    color: white;
}

.btn-primary-student-theme:hover {
    background: var(--student-gradient-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(23, 162, 184, 0.4);
    color: white; /* Ensure text color remains white on hover */
}

.btn-primary-student-theme:focus {
    box-shadow: 0 0 0 0.2rem rgba(23, 162, 184, 0.25);
}

/* Specific styles for update display */
.question-item {
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    padding: 2rem;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
}

.question-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

.question-content p {
    margin-bottom: 0.75rem;
    font-size: 1.1rem;
    color: var(--student-dark);
    word-wrap: break-word; /* Ensure long questions wrap */
}

.question-content p strong {
    color: var(--student-primary);
}

.empty-state .empty-title {
    color: var(--student-dark);
    font-weight: 700;
    margin-top: 1rem;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .enhanced-card-header {
        padding: 1rem;
    }
    .card-body {
        padding: 1.5rem !important;
    }
    .question-item {
        padding: 1.5rem;
    }
    .question-content p {
        font-size: 1rem;
    }
    .btn-lg {
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
    }
}
</style>
{% endblock %}
